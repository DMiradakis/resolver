name: Test

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test
        run: dotnet test src/Resolver.sln --configuration Release --verbosity minimal
